AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Matches production's real topology for QRScanner's static site: a fully
  private S3 bucket (no public access at all) served exclusively through
  CloudFront via Origin Access Control (OAC) -- the modern replacement for
  the older OAI pattern, confirmed against the live production distribution
  before building this. No custom domain, no SPA-style error-page
  redirects, index.html as the default root object -- same as production.
  Content is pushed separately (aws s3 sync) after the stack exists; this
  template only provisions the bucket + distribution + the policy binding
  them together. Safe to delete at any time.

Parameters:
  EnvPrefix:
    Type: String
    Default: indietix-sandbox
    Description: Namespace prefix for this environment (e.g. indietix-sandbox, indietix-prod, myvenue-prod)

Resources:
  StaticSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvPrefix}-qrscanner-static-site"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvPrefix}-static-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  StaticSiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: StaticSiteBucketOrigin
            DomainName: !GetAtt StaticSiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: StaticSiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS Managed-CachingOptimized
          Compress: true

  StaticSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticSiteBucket
      PolicyDocument:
        Version: "2008-10-17"
        Id: PolicyForCloudFrontPrivateContent
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${StaticSiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${StaticSiteDistribution}"

Outputs:
  BucketName:
    Value: !Ref StaticSiteBucket
  DistributionId:
    Value: !Ref StaticSiteDistribution
  DistributionDomainName:
    Value: !GetAtt StaticSiteDistribution.DomainName
