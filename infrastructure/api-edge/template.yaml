AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IndieTix API edge (bootstrap.sh API_EDGE="true"): CloudFront in front of
  this environment's QRScanner Function URL, with a WAF. A Function URL
  can't take a WAF directly. Deployed in us-east-1 (CloudFront-scope web
  ACLs only exist there), whatever region the environment is in. CloudFront
  adds X-IndieTix-Edge to every request it forwards; QRScanner refuses
  requests without it (EDGE_ORIGIN_SECRET), so nothing can skip the
  firewall by calling the Function URL directly. Nothing is cached.

Parameters:
  EnvPrefix:
    Type: String
    Description: Namespace prefix for this environment (e.g. indietix-sandbox)
  ApiOriginDomain:
    Type: String
    Description: The QRScanner Function URL's host name (no https://, no path)
  SensitiveRateLimit:
    Type: Number
    Default: 100
    MinValue: 10
    Description: Requests per 5 minutes per IP to login, signup, password and Square sign-in routes
  OverallRateLimit:
    Type: Number
    Default: 3000
    MinValue: 100
    Description: Requests per 5 minutes per IP to the whole API

Resources:
  ApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${EnvPrefix}-api"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${EnvPrefix}-api"
      Rules:
        # Brute force and signup abuse: the public, unauthenticated routes.
        - Name: sensitive-routes-rate
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref SensitiveRateLimit
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/login
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/public/
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        SearchString: password
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: STARTS_WITH
                        SearchString: /square/oauth
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${EnvPrefix}-api-sensitive-rate"
        - Name: overall-rate
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref OverallRateLimit
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${EnvPrefix}-api-overall-rate"
        - Name: ip-reputation
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${EnvPrefix}-api-ip-reputation"
        # Common exploits, with two rules counted instead of blocking: the
        # API legitimately takes large bodies (base64 poster uploads, up to
        # 6 MB) and HTML (marketing posts, legal text).
        - Name: common
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse: { Count: {} }
                - Name: CrossSiteScripting_BODY
                  ActionToUse: { Count: {} }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${EnvPrefix}-api-common"
        - Name: known-bad-inputs
          Priority: 4
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${EnvPrefix}-api-known-bad-inputs"

  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${EnvPrefix} API (QRScanner) behind WAF"
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        WebACLId: !GetAtt ApiWebAcl.Arn
        Origins:
          - Id: qrscanner-function-url
            DomainName: !Ref ApiOriginDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              # Above QRScanner's own 40 s limit (60 is CloudFront's default maximum).
              OriginReadTimeout: 60
            OriginCustomHeaders:
              # bootstrap.sh keeps the value in Secrets Manager (us-east-1),
              # indieTix/edge/<EnvPrefix> = {"secret": ...}, so it never
              # passes through a command line or this template.
              - HeaderName: X-IndieTix-Edge
                HeaderValue: !Sub "{{resolve:secretsmanager:indieTix/edge/${EnvPrefix}:SecretString:secret}}"
        DefaultCacheBehavior:
          TargetOriginId: qrscanner-function-url
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed policies: CachingDisabled, AllViewerExceptHostHeader
          # (the Function URL needs its own Host header).
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  ApiUrl:
    Description: The API's address behind the firewall (config.js INDIETIX_API_URL)
    Value: !Sub "https://${ApiDistribution.DomainName}"
  WebAclArn:
    Value: !GetAtt ApiWebAcl.Arn
