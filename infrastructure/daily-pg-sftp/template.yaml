AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Nightly box-office report job (BDOR/EBOR) -> SFTP/FTP. CAUTION: a
  client with USE_FTP=true in its configuration will attempt a real
  external FTP send (e.g. ftp.boxofficeessentials.com) when this is
  invoked -- do not flip USE_FTP=true for a test/throwaway client
  unless you intend to send it fabricated data for real.

Parameters:
  EnvPrefix:
    Type: String
    Default: indietix-sandbox
    Description: Namespace prefix for this environment (e.g. indietix-sandbox, indietix-prod, myvenue-prod)

Resources:
  DailyPgSftpLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${EnvPrefix}-daily-pg-sftp-deps"
      ContentUri: layer/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Delete

  DailyPgSftpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvPrefix}-daily-pg-sftp"
      CodeUri: src/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 120
      MemorySize: 256
      Layers:
        - !Ref DailyPgSftpLayer
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
            'Fn::Sub': '${EnvPrefix}-AuroraSecurityGroupId'
        SubnetIds:
          - !ImportValue
            'Fn::Sub': '${EnvPrefix}-PrivateSubnetA'
          - !ImportValue
            'Fn::Sub': '${EnvPrefix}-PrivateSubnetB'
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:indieTix/rds/clients/*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${EnvPrefix}-*"
                - !Sub "arn:aws:s3:::${EnvPrefix}-*/*"
