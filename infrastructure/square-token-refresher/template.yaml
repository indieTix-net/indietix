AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Keeps Connect Square (OAuth) venues' Square access tokens fresh (see the
  squareTokenRefresher folder's README). Runs daily. Finds venues by
  their refresh-token secrets (indieTix/square/clients/<id>), reads each
  venue's database with its own credentials secret, and emails on
  failure. Does nothing until bootstrap.sh sets SQUARE_APP_ID and
  SQUARE_APP_SECRET_ID on the function (SQUARE_APP_ID in
  bootstrap.config.sh); those, SQUARE_API_BASE and OPERATOR_ALERT_EMAIL
  are set outside this template, like QRScanner's.

Parameters:
  EnvPrefix:
    Type: String
    Default: indietix-sandbox
    Description: Namespace prefix for this environment (e.g. indietix-sandbox, indietix-prod, myvenue-prod)

Resources:
  SquareTokenRefresherLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${EnvPrefix}-square-token-refresher-deps"
      ContentUri: layer/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Delete

  SquareTokenRefresherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvPrefix}-square-token-refresher"
      CodeUri: src/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 300
      MemorySize: 256
      Layers:
        - !Ref SquareTokenRefresherLayer
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
            'Fn::Sub': '${EnvPrefix}-AuroraSecurityGroupId'
        SubnetIds:
          - !ImportValue
            'Fn::Sub': '${EnvPrefix}-PrivateSubnetA'
          - !ImportValue
            'Fn::Sub': '${EnvPrefix}-PrivateSubnetB'
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(15 10 * * ? *)  # 10:15 UTC, early morning in the US
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:ListSecrets
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:indieTix/rds/clients/*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:indieTix/square/app/${EnvPrefix}-*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:indieTix/square/clients/*"
            - Effect: Allow
              Action:
                - ses:SendRawEmail
              Resource: "*"
