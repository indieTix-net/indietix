<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="user-management.css">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div id="header-container">
            <!-- Header will be injected here -->
        </div>
        
        <div class="page-header">
            <button class="btn btn-success" id="create-user-btn">
                <i class="fas fa-plus"></i> Create New User
            </button>
        </div>
        
        <div class="table-container">
            <table class="table table-bordered table-striped user-table" id="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>View Permission</th>
                        <th>Edit Permission</th>
                        <th>Data Filters</th>
                        <th class="action-column">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <tr>
                        <td colspan="9" style="text-align: center;">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Create/Edit User Modal -->
    <div class="modal fade" id="user-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">Create User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="user-form">
                        <input type="hidden" id="user-id">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label">Username *</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            
                            <div class="col-md-6 mb-3" id="password-group">
                                <label for="password" class="form-label">Password *</label>
                                <input type="password" class="form-control" id="password" required minlength="8">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Permissions</label>
                            <div class="permission-checkboxes">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="view-permission" checked>
                                    <label class="form-check-label" for="view-permission">
                                        View
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="edit-permission">
                                    <label class="form-check-label" for="edit-permission">
                                        Edit
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Data Filters</label>
                            <div id="data-filters-container"></div>
                            <button type="button" class="btn btn-sm btn-outline-primary" id="add-filter-btn">
                                <i class="fas fa-plus"></i> Add Filter
                            </button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="save-user-btn">Save User</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer" style="text-align: center;">	
        <!-- Logout button will be added here by JavaScript -->
    </div>
</div>
    
<!-- Bootstrap and custom JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth-helper.js"></script>
<script src="user-management.js"></script>
<script src="header-loader.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize dynamic header
        HeaderLoader.initializeHeader('header-container');
    });
</script>
</body>
</html>
