<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndieTix Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
    <link href="dashboard.css" rel="stylesheet">
    <link rel="stylesheet" href="oxblood-theme.css">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div id="header-container">
            <!-- Header will be injected here -->
        </div>

        <!-- Dashboard toolbar -->
        <div class="dash-toolbar">
            <div class="dash-toolbar__title">
                <h1 id="dash-title">Today's Shows</h1>
                <span id="dash-date" class="dash-toolbar__date"></span>
            </div>
            <div class="dash-toolbar__status">
                <input type="date" id="dash-date-picker" class="dash-date-picker" aria-label="Choose a date to view">
                <button id="dash-today-btn" type="button" class="dash-today-btn" style="display:none;">Today</button>
                <span id="dash-live" class="dash-live" title="This page refreshes automatically">
                    <span class="dash-live__dot">&#9679;</span> Live
                </span>
                <span id="dash-last-refreshed" class="dash-last-refreshed" aria-live="polite"></span>
            </div>
        </div>

        <!-- Card grid (max 12 cards, 4 x 3) -->
        <div id="dashboard-grid" class="dashboard-grid"></div>

        <!-- Empty state -->
        <div id="dash-empty" class="dash-empty" style="display:none;">
            <div class="dash-empty__icon">&#127902;</div>
            <p id="dash-empty-text">No shows scheduled for today.</p>
        </div>

        <!-- Loading indicator -->
        <div id="loading" class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <div class="footer">
        <button id="logout-btn" class="logout-button">Logout</button>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JavaScript -->
<script src="auth-helper.js"></script>
<script src="dashboard.js"></script>
<script src="header-loader.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize dynamic header
        HeaderLoader.initializeHeader('header-container');
    });
</script>
</body>
</html>
