<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="opt-in.css">
    <link rel="stylesheet" href="oxblood-theme.css">
</head>
<body>
<div class="page-wrapper">
    <div class="container text-center py-5">

        <div id="state-loading">
            <div class="spinner-border text-secondary" role="status">
                <span class="visually-hidden">Loading&hellip;</span>
            </div>
            <p class="text-muted mt-3">Processing your request&hellip;</p>
        </div>

        <div id="state-success" class="d-none">
            <div class="alert alert-success">
                <h5 class="alert-heading">You're unsubscribed</h5>
                <p class="mb-0">You won't receive any more marketing emails from us. Changed your mind? You can always sign up again.</p>
            </div>
        </div>

        <div id="state-error" class="d-none">
            <div class="alert alert-warning">
                <h5 class="alert-heading">This link isn't valid</h5>
                <p class="mb-0" id="error-message">That unsubscribe link may have expired or already been used.</p>
            </div>
        </div>

    </div>
</div>

<script src="config.js"></script>
<script src="email-unsubscribe.js"></script>
</body>
</html>
