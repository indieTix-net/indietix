<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="client.css">
    <link rel="stylesheet" href="marketing.css">
    <link rel="stylesheet" href="marketing-posts.css">
    <link rel="stylesheet" href="oxblood-theme.css">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div id="header-container">
            <!-- Header will be injected here -->
        </div>

        <div class="client-form-container">
            <div class="form-section">
                <div class="section-header">
                    <h4>Posts</h4>
                    <p class="text-muted">Review and approve drafts, see what's scheduled, and look back at what went out. Schedules are set on the <a href="marketing.html">Marketing Schedule</a> page.</p>
                </div>

                <ul class="nav nav-tabs posts-tabs" id="posts-tabs" role="tablist">
                    <li class="nav-item"><button type="button" class="nav-link" data-tab="review">Needs review <span class="badge" data-count="review"></span></button></li>
                    <li class="nav-item"><button type="button" class="nav-link" data-tab="scheduled">Scheduled <span class="badge" data-count="scheduled"></span></button></li>
                    <li class="nav-item"><button type="button" class="nav-link" data-tab="sent">Sent <span class="badge" data-count="sent"></span></button></li>
                    <li class="nav-item"><button type="button" class="nav-link" data-tab="problems">Problems <span class="badge" data-count="problems"></span></button></li>
                </ul>

                <form class="posts-filters" id="posts-filters">
                    <select class="form-select form-select-sm" id="filter-item" aria-label="Show">
                        <option value="">All shows</option>
                    </select>
                    <select class="form-select form-select-sm" id="filter-channel" aria-label="Channel">
                        <option value="">All channels</option>
                        <option value="email">Email</option>
                        <option value="facebook">Facebook</option>
                        <option value="instagram">Instagram</option>
                        <option value="tiktok">TikTok</option>
                    </select>
                    <label class="posts-filter-date">From <input type="date" class="form-control form-control-sm" id="filter-from"></label>
                    <label class="posts-filter-date">To <input type="date" class="form-control form-control-sm" id="filter-to"></label>
                    <input type="search" class="form-control form-control-sm" id="filter-search" placeholder="Search captions">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Search</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="filter-clear">Clear</button>
                </form>

                <div class="posts-selection-bar" id="selection-bar" hidden>
                    <label class="form-check-label"><input type="checkbox" class="form-check-input me-1" id="select-page"> Select all on this page</label>
                    <span class="text-muted small" id="selection-count"></span>
                    <button type="button" class="btn btn-sm btn-primary" id="approve-selected-btn" disabled>Approve selected</button>
                </div>

                <div class="list-pager d-flex flex-wrap align-items-center justify-content-center gap-2 my-3" hidden></div>
                <div id="posts-container" aria-live="polite"></div>
                <div class="list-pager d-flex flex-wrap align-items-center justify-content-center gap-2 my-3" hidden></div>
            </div>
        </div>

        <div class="footer" style="text-align: center;">
            <!-- Logout button will be added here by JavaScript -->
        </div>
    </div>
</div>

<!-- Edit post modal -->
<div class="modal fade" id="edit-post-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Post</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3 text-center">
                    <img id="edit-post-image-preview" src="" alt="" style="max-width:100%; max-height:200px; display:none; border-radius:8px;">
                    <div id="edit-post-image-empty" class="text-muted small">No image yet.</div>
                </div>
                <div class="mb-3">
                    <label for="edit-post-image-upload" class="btn btn-outline-secondary btn-sm">Replace Image&hellip;</label>
                    <input type="file" id="edit-post-image-upload" accept="image/*" style="display:none;">
                </div>
                <div class="mb-3">
                    <label for="edit-post-caption" class="form-label">Caption</label>
                    <textarea class="form-control" id="edit-post-caption" rows="5"></textarea>
                </div>
                <div id="edit-post-error" class="text-danger small d-none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm" id="edit-post-save-btn">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="ui-dialogs.js"></script>
<script src="auth-helper.js"></script>
<script src="list-pager.js"></script>
<script src="marketing-posts.js"></script>
<script src="header-loader.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        HeaderLoader.initializeHeader('header-container');
    });
</script>
</body>
</html>
