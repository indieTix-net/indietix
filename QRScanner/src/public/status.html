<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndieTix status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="opt-in.css">
    <link rel="stylesheet" href="oxblood-theme.css">
    <style>
        .status-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .status-operational .status-dot { background: #2fbf71; }
        .status-problem .status-dot { background: #e5484d; }
        .status-unknown .status-dot { background: #8a8f98; }
        .status-label { font-weight: 600; white-space: nowrap; }
        .status-operational .status-label { color: #2fbf71; }
        .status-problem .status-label { color: #e5484d; }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="container" style="max-width: 640px;">

        <!-- Standalone header, same convention as support.html -- public
             page, not auth-gated, so header-loader.js isn't used here. -->
        <div class="text-center py-4 mb-4 border-bottom border-dark border-3">
            <img src="indieTixLogo.png" alt="IndieTix" style="max-width: 160px;" onerror="this.style.display='none';">
            <h4 class="mt-3 mb-0">System status</h4>
        </div>

        <div id="overall" class="alert alert-secondary" role="status">Checking...</div>

        <div id="components"></div>

        <p id="checked-at" class="text-muted small mt-3"></p>
        <p class="text-muted small">This page checks again every minute. Problems are detected automatically, and we're alerted as soon as one starts.</p>

        <p class="text-center text-muted small mt-5"><a href="support.html">Help and support</a></p>
    </div>
</div>

<script src="config.js"></script>
<script src="status.js"></script>
</body>
</html>
